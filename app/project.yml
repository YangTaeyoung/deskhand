name: Deskhand
options:
  bundleIdPrefix: io.github.yangtaeyoung
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: ko
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  DeskhandKit:
    path: DeskhandKit
targets:
  Deskhand:
    type: application
    platform: macOS
    sources:
      - path: Deskhand/Sources
      # XcodeGen infers the resources build phase from the file type.
      - path: Deskhand/Resources/Assets.xcassets
    dependencies:
      - package: DeskhandKit
        product: DeskhandUI
      - package: DeskhandKit
        product: DeskhandClient
      - package: DeskhandKit
        product: DeskhandMedia
    settings:
      base:
        PRODUCT_NAME: Deskhand
        # The bundle executable is DeskhandApp; Contents/MacOS/deskhand is the Go CLI copied by scripts/build-app.sh.
        EXECUTABLE_NAME: DeskhandApp
        PRODUCT_BUNDLE_IDENTIFIER: io.github.yangtaeyoung.Deskhand
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Deskhand
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 YangTaeyoung"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEAD_CODE_STRIPPING: YES
schemes:
  Deskhand:
    build:
      targets:
        Deskhand: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
